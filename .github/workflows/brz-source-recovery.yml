name: BRZ Core Source Recovery

on:
  push:
    branches:
      - agent/brz-10-dev
    paths:
      - .github/workflows/brz-source-recovery.yml

permissions:
  contents: write

jobs:
  recover-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full worker history
        uses: actions/checkout@v4
        with:
          ref: agent/brz-10-dev
          fetch-depth: 0

      - name: Find a valid historical Core payload set
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          mkdir -p /tmp/brz-core-search /tmp/brz-core-extract

          python3 - <<'PY'
          import base64
          import gzip
          import io
          import itertools
          import os
          import subprocess
          import tarfile

          paths = [
              'deploy/payloads/bizrise-core-v0.8.1.part-00.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-01.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-02.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-03.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-04.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-05.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-06a.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-06b.b64',
          ]

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          candidates = []
          for path in paths:
              commits = run('git', 'log', '--all', '--format=%H', '--', path).splitlines()
              blobs = []
              seen = set()
              for commit in commits:
                  try:
                      row = run('git', 'ls-tree', '-r', commit, '--', path)
                  except subprocess.CalledProcessError:
                      continue
                  if not row:
                      continue
                  blob = row.split()[2]
                  if blob not in seen:
                      seen.add(blob)
                      blobs.append(blob)
              if not blobs:
                  raise SystemExit(f'No historical blob candidates for {path}')
              candidates.append(blobs)
              print(path, 'candidates:', ','.join(blobs))

          attempts = 0
          found = None
          for combo in itertools.product(*candidates):
              attempts += 1
              chunks = []
              try:
                  for blob in combo:
                      text = subprocess.check_output(['git', 'cat-file', 'blob', blob])
                      chunks.append(b''.join(text.split()))
                  payload = b''.join(chunks)
                  raw = base64.b64decode(payload, validate=True)
                  data = gzip.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as tf:
                      names = tf.getnames()
                      if not any(name.endswith('/bizrise-core.php') or name == 'bizrise-core.php' for name in names):
                          continue
                  found = (combo, raw, names)
                  break
              except Exception:
                  continue

          if not found:
              raise SystemExit(f'No valid Core archive found after {attempts} combinations')

          combo, raw, names = found
          out = '/tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz'
          with open(out, 'wb') as f:
              f.write(raw)
          print('VALID_CORE_PAYLOAD_SET')
          for path, blob in zip(paths, combo):
              print(f'{path} {blob}')
          print('archive_members:', len(names))
          print('\n'.join(names[:100]))
          PY

          tar -tzf /tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz >/tmp/brz-core-search/members.txt
          tar -xzf /tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz -C /tmp/brz-core-extract

      - name: Restore and validate Core source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRZ-10 Source Recovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CORE_MAIN="$(find /tmp/brz-core-extract -type f -name 'bizrise-core.php' | head -n 1)"
          test -n "$CORE_MAIN"
          CORE_SRC="$(dirname "$CORE_MAIN")"
          echo "CORE_SRC=$CORE_SRC"
          find "$CORE_SRC" -maxdepth 5 -type f | sort

          rm -rf apps/bizrise-core
          mkdir -p apps/bizrise-core
          cp -a "$CORE_SRC"/. apps/bizrise-core/

          test -f apps/bizrise-core/bizrise-core.php
          find apps/bizrise-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

          if grep -R -nE '/home/dangduon6a72|/public_html' apps/bizrise-core --include='*.php'; then
            echo "Hard-coded hosting path detected in recovered Bizrise Core." >&2
            exit 1
          fi

          if grep -R -nE 'https?://(www\.)?dangduonggroup\.com' apps/bizrise-core --include='*.php'; then
            echo "Hard-coded production domain detected in recovered Bizrise Core." >&2
            exit 1
          fi

          grep -R -n "bizrise_product" apps/bizrise-core || true
          grep -R -nE "register_taxonomy|add_action|add_filter|require_once|include_once" apps/bizrise-core || true

          git add apps/bizrise-core
          git rm .github/workflows/brz-source-recovery.yml
          git commit -m "chore(core): restore bizrise core source"
          git push origin HEAD:agent/brz-10-dev

      - name: Recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BRZ-10 Core Source Recovery'
            echo
            echo '- Source: validated historical combinations of bizrise-core-v0.8.1 payload chunks'
            echo '- Validation: base64, gzip, tar, PHP lint, hosting-path/domain scan'
            echo '- Production branch was not modified'
          } >> "$GITHUB_STEP_SUMMARY"
