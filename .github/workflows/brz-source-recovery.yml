name: BRZ Core Source Recovery

on:
  pull_request:
    branches:
      - agent/brz-10-dev
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          ref: agent/brz-10-dev
          fetch-depth: 0

      - name: Recover available Core modules and inspect history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          rm -rf /tmp/brz-core && mkdir -p /tmp/brz-core/extract

          echo '=== ALL GIT OBJECT PATHS MATCHING BIZRISE CORE ==='
          git rev-list --objects --all | grep -Ei 'bizrise[-_/]?core|production-content|content-model|media-mapper' | sort -u || true

          cat deploy/payloads/bizrise-core-v0.8.1.part-*.b64 | tr -d '\r\n' | base64 -d > /tmp/brz-core/core.tar.gz
          set +e
          gzip -dc /tmp/brz-core/core.tar.gz > /tmp/brz-core/core.tar
          GZIP_RC=$?
          set -e
          echo "gzip_rc=$GZIP_RC tar_bytes=$(wc -c < /tmp/brz-core/core.tar)"

          set +e
          tar --ignore-zeros -xf /tmp/brz-core/core.tar -C /tmp/brz-core/extract 2>/tmp/brz-core/tar.err
          TAR_RC=$?
          set -e
          echo "tar_rc=$TAR_RC"
          cat /tmp/brz-core/tar.err || true

          echo '=== RECOVERED FILES ==='
          find /tmp/brz-core/extract -type f -printf '%P %s bytes\n' | sort

          echo '=== PHP LINT ==='
          find /tmp/brz-core/extract -type f -name '*.php' -print0 | xargs -0 -n1 php -l

          echo '=== DEPENDENCIES HOOKS CPT TAXONOMY CLASSES ==='
          grep -R -nE 'require(_once)?|include(_once)?|add_action|add_filter|register_post_type|register_taxonomy|register_activation_hook|^class |^final class |^function |bizrise_product' /tmp/brz-core/extract --include='*.php' | head -2000 || true

          echo '=== FILE HEADERS ==='
          while IFS= read -r f; do
            echo "----- ${f#/tmp/brz-core/extract/} -----"
            sed -n '1,45p' "$f"
          done < <(find /tmp/brz-core/extract -type f -name '*.php' | sort)
