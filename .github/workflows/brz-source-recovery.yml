name: BRZ Core Source Recovery

on:
  pull_request:
    branches:
      - agent/brz-10-dev
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker with full history
        uses: actions/checkout@v4
        with:
          ref: agent/brz-10-dev
          fetch-depth: 0

      - name: Find a valid historical Core payload set
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          mkdir -p /tmp/brz-core-search /tmp/brz-core-extract

          python3 - <<'PY'
          import base64, gzip, io, itertools, subprocess, tarfile

          paths = [
              'deploy/payloads/bizrise-core-v0.8.1.part-00.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-01.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-02.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-03.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-04.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-05.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-06a.b64',
              'deploy/payloads/bizrise-core-v0.8.1.part-06b.b64',
          ]

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          candidates = []
          for path in paths:
              commits = run('git', 'log', '--all', '--format=%H', '--', path).splitlines()
              blobs, seen = [], set()
              for commit in commits:
                  row = run('git', 'ls-tree', '-r', commit, '--', path)
                  if not row:
                      continue
                  blob = row.split()[2]
                  if blob not in seen:
                      seen.add(blob)
                      blobs.append(blob)
              if not blobs:
                  raise SystemExit(f'No historical candidates for {path}')
              candidates.append(blobs)
              print(path, len(blobs), 'candidate(s)', blobs)

          found = None
          attempts = 0
          for combo in itertools.product(*candidates):
              attempts += 1
              try:
                  payload = b''.join(
                      b''.join(subprocess.check_output(['git','cat-file','blob',blob]).split())
                      for blob in combo
                  )
                  raw = base64.b64decode(payload, validate=True)
                  data = gzip.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as tf:
                      names = tf.getnames()
                      if not any(n.endswith('/bizrise-core.php') or n == 'bizrise-core.php' for n in names):
                          continue
                  found = combo, raw, names
                  break
              except Exception:
                  pass

          if found is None:
              raise SystemExit(f'No valid Core archive after {attempts} combinations')

          combo, raw, names = found
          with open('/tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz','wb') as f:
              f.write(raw)
          print('VALID_CORE_PAYLOAD_SET after', attempts, 'attempts')
          for path, blob in zip(paths, combo):
              print(path, blob)
          print('archive members', len(names))
          PY

          tar -tzf /tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz > /tmp/brz-core-search/members.txt
          tar -xzf /tmp/brz-core-search/bizrise-core-v0.8.1.tar.gz -C /tmp/brz-core-extract

      - name: Restore, audit and commit Core source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRZ-10 Source Recovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CORE_MAIN="$(find /tmp/brz-core-extract -type f -name 'bizrise-core.php' | head -n 1)"
          test -n "$CORE_MAIN"
          CORE_SRC="$(dirname "$CORE_MAIN")"
          echo "CORE_SRC=$CORE_SRC"
          find "$CORE_SRC" -maxdepth 5 -type f | sort

          rm -rf apps/bizrise-core
          mkdir -p apps/bizrise-core
          cp -a "$CORE_SRC"/. apps/bizrise-core/
          test -f apps/bizrise-core/bizrise-core.php

          find apps/bizrise-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

          if grep -R -nE '/home/dangduon6a72|/public_html' apps/bizrise-core --include='*.php'; then
            echo 'Hard-coded hosting path detected.' >&2
            exit 1
          fi
          if grep -R -nE 'https?://(www\.)?dangduonggroup\.com' apps/bizrise-core --include='*.php'; then
            echo 'Hard-coded production domain detected.' >&2
            exit 1
          fi

          echo '--- bizrise_product references ---'
          grep -R -n 'bizrise_product' apps/bizrise-core || true
          echo '--- taxonomy/hooks/dependencies ---'
          grep -R -nE 'register_taxonomy|add_action|add_filter|require_once|include_once' apps/bizrise-core || true

          git add apps/bizrise-core
          git rm .github/workflows/brz-source-recovery.yml
          git commit -m 'chore(core): restore bizrise core source'
          git push origin HEAD:agent/brz-10-dev
