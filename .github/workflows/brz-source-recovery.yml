name: BRZ-10 Source Recovery Validation

on:
  pull_request:
    branches:
      - agent/brz-10-dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          ref: agent/brz-10-dev
          fetch-depth: 0

      - name: Validate PHP source and dependencies
        shell: bash
        run: |
          set -euo pipefail

          THEME=apps/ddg-beauty-premium
          CORE=apps/bizrise-core
          test -d "$THEME"
          test -d "$CORE"

          echo '=== PHP LINT: THEME ==='
          find "$THEME" -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          echo '=== PHP LINT: CORE ==='
          find "$CORE" -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

          echo '=== THEME FUNCTIONS REQUIRE TARGETS ==='
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('apps/ddg-beauty-premium')
          text=(root/'functions.php').read_text()
          required=re.findall(r"get_template_directory\(\)\s*\.\s*['\"]([^'\"]+)['\"]",text)
          missing=[]
          for rel in required:
              path=root/rel.lstrip('/')
              print(rel, 'OK' if path.is_file() else 'MISSING')
              if not path.is_file(): missing.append(rel)
          if missing:
              print('Missing theme requires:',missing,file=sys.stderr); sys.exit(1)
          PY

          echo '=== CORE REQUIRE TARGETS ==='
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('apps/bizrise-core')
          text=(root/'bizrise-core.php').read_text()
          required=re.findall(r"BIZRISE_CORE_PATH\s*\.\s*['\"]([^'\"]+)['\"]",text)
          missing=[]
          for rel in required:
              path=root/rel
              print(rel, 'OK' if path.is_file() else 'MISSING')
              if not path.is_file(): missing.append(rel)
          if missing:
              print('Missing Core requires:',missing,file=sys.stderr); sys.exit(1)
          PY

          echo '=== THEME ENQUEUE TARGETS ==='
          test -f "$THEME/assets/css/theme.css"
          test -f "$THEME/assets/css/navigation.css"
          test -f "$THEME/assets/js/theme.js"
          grep -nE 'wp_enqueue_(style|script)' "$THEME/inc/assets.php"

          echo '=== WORDPRESS FOUNDATION ==='
          grep -q 'wp_head' "$THEME/header.php"
          grep -q 'wp_body_open' "$THEME/header.php"
          grep -q 'wp_footer' "$THEME/footer.php"
          grep -q 'get_header' "$THEME/front-page.php"
          grep -q 'get_footer' "$THEME/front-page.php"
          grep -q 'get_header' "$THEME/page.php"
          grep -q 'get_footer' "$THEME/page.php"
          grep -q 'get_header' "$THEME/single.php"
          grep -q 'get_footer' "$THEME/single.php"
          grep -q 'get_header' "$THEME/archive.php"
          grep -q 'get_footer' "$THEME/archive.php"

          echo '=== CORE MODEL ==='
          grep -q "POST_TYPE = 'bizrise_product'" "$CORE/src/ContentTypes/Product.php"
          grep -q "register_post_type" "$CORE/src/ContentTypes/Product.php"
          grep -q "bizrise_brand" "$CORE/src/Taxonomies/ProductTaxonomies.php"
          grep -q "bizrise_product_category" "$CORE/src/Taxonomies/ProductTaxonomies.php"
          grep -q "bizrise_collection" "$CORE/src/Taxonomies/ProductTaxonomies.php"
          grep -q "bizrise_concern" "$CORE/src/Taxonomies/ProductTaxonomies.php"
          grep -q "bizrise_routine_type" "$CORE/src/Taxonomies/ProductTaxonomies.php"
          grep -q "META_REGULATORY_STATUS" "$CORE/src/Fields/ProductTruth.php"
          grep -q "META_VERIFICATION_STATUS" "$CORE/src/Fields/ProductTruth.php"
          grep -q "regulatory_status_not_active" "$CORE/src/Support/PublicationGate.php"
          grep -q "verification_not_verified" "$CORE/src/Support/PublicationGate.php"
          grep -q "legal_hold" "$CORE/src/Support/PublicationGate.php"

          echo '=== HOSTING PATH / PRODUCTION DOMAIN SCAN ==='
          if grep -R -nE '/home/dangduon6a72|/public_html' "$THEME" "$CORE" --include='*.php' --include='*.css' --include='*.js'; then
            echo 'Hard-coded hosting path detected in app source.' >&2
            exit 1
          fi
          if grep -R -nE 'https?://(www\.)?dangduonggroup\.com' "$THEME" "$CORE" --include='*.php' --include='*.css' --include='*.js'; then
            echo 'Hard-coded production domain detected in app source.' >&2
            exit 1
          fi

          echo '=== NO BASE64 SOURCE DEPENDENCY ==='
          if grep -R -nE 'deploy/payloads|\.b64' "$THEME" "$CORE" --include='*.php'; then
            echo 'App runtime still depends on payloads.' >&2
            exit 1
          fi

          echo 'VALIDATION PASS'
