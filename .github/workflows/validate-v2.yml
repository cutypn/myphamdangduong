name: Validate Bizrise DDG V2

on:
  push:
    branches:
      - codex/rebuild-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find apps/bizrise-core apps/bizrise-ddg-theme apps/bizrise-ddg-migrator -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Deployment shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/deploy.sh
          bash -n deploy/smoke-test.sh

      - name: Validate Product Truth seed
        run: python3 tests/smoke/validate_product_seed.py

      - name: Validate controlled 44-SKU media manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('apps/bizrise-ddg-migrator/data/product-media-manifest.csv')
          required = {
              'key', 'source_filename', 'brand', 'product_name', 'pack_size',
              'poster_filename', 'status', 'categories'
          }
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig', newline='')))
          if len(rows) != 44:
              raise SystemExit(f'controlled media manifest must contain exactly 44 rows, got {len(rows)}')

          missing_headers = required.difference(rows[0].keys() if rows else ())
          if missing_headers:
              raise SystemExit(f'manifest missing required headers: {sorted(missing_headers)}')

          def clean(value):
              return (value or '').strip()

          for index, row in enumerate(rows, start=2):
              missing = [name for name in required if not clean(row.get(name))]
              if missing:
                  raise SystemExit(f'manifest row {index} missing required values: {missing}')
              if not clean(row['source_filename']).lower().endswith(('.jpg', '.jpeg', '.png', '.webp')):
                  raise SystemExit(f'manifest row {index} has invalid source filename: {row["source_filename"]!r}')
              if not clean(row['poster_filename']).lower().endswith(('.jpg', '.jpeg', '.png', '.webp')):
                  raise SystemExit(f'manifest row {index} has invalid poster filename: {row["poster_filename"]!r}')

          for field in ('key', 'source_filename', 'poster_filename'):
              values = [clean(row[field]).casefold() for row in rows]
              duplicates = sorted({value for value in values if values.count(value) > 1})
              if duplicates:
                  raise SystemExit(f'manifest contains duplicate {field}: {duplicates}')

          identity = [
              (clean(row['brand']).casefold(), clean(row['product_name']).casefold(), clean(row['pack_size']).casefold())
              for row in rows
          ]
          duplicate_identity = sorted({value for value in identity if identity.count(value) > 1})
          if duplicate_identity:
              raise SystemExit(f'manifest contains duplicate brand/product/pack identity: {duplicate_identity}')

          print('validated deterministic 44-SKU media manifest: 44 unique keys, sources, posters and identities')
          PY

      - name: Validate JSON and publish-ready article data
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool apps/bizrise-ddg-migrator/data/product-truth-seed.json >/dev/null
          python3 -m json.tool profiles/dang-duong/brand.json >/dev/null
          python3 -m json.tool profiles/dang-duong/media-manifest.json >/dev/null
          python3 -m json.tool data/content/article-registry.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('data/content/article-registry.json').read_text(encoding='utf-8'))
          eligible = [a for a in registry.get('articles', []) if a.get('status') == 'publish_ready']
          if len(eligible) != 10:
              raise SystemExit(f'expected 10 publish_ready articles, got {len(eligible)}')
          slugs = set()
          for article in eligible:
              slug = article.get('slug', '')
              if not slug or slug in slugs:
                  raise SystemExit(f'invalid or duplicate slug: {slug!r}')
              slugs.add(slug)
              path = Path(article['source_file'])
              if not path.is_file():
                  raise SystemExit(f'missing article source: {path}')
              body = path.read_text(encoding='utf-8')
              if '# ' not in body or '## ' not in body:
                  raise SystemExit(f'article source lacks required heading structure: {path}')
          print(f'validated {len(eligible)} publish-ready article sources')
          PY
