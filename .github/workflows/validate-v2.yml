name: Validate Bizrise DDG V2

on:
  push:
    branches:
      - codex/rebuild-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find apps/bizrise-core apps/bizrise-ddg-theme apps/bizrise-ddg-migrator -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Deployment shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/deploy.sh
          bash -n deploy/smoke-test.sh

      - name: Validate Product Truth seed
        run: python3 tests/smoke/validate_product_seed.py

      - name: Validate JSON data
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool apps/bizrise-ddg-migrator/data/product-truth-seed.json >/dev/null
          python3 -m json.tool profiles/dang-duong/brand.json >/dev/null
          python3 -m json.tool profiles/dang-duong/media-manifest.json >/dev/null
          python3 -m json.tool data/content/article-registry.json >/dev/null
