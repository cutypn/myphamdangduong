name: Build Bizrise DDG V2 Release

on:
  push:
    branches:
      - codex/rebuild-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP and deployment scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          find apps/bizrise-core apps/bizrise-ddg-theme apps/bizrise-ddg-migrator -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          bash -n deploy/deploy.sh
          bash -n deploy/smoke-test.sh

      - name: Validate Product Truth and content data
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/smoke/validate_product_seed.py
          python3 -m json.tool apps/bizrise-ddg-migrator/data/product-truth-seed.json >/dev/null
          python3 -m json.tool profiles/dang-duong/brand.json >/dev/null
          python3 -m json.tool profiles/dang-duong/media-manifest.json >/dev/null
          python3 -m json.tool data/content/article-registry.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('data/content/article-registry.json').read_text(encoding='utf-8'))
          eligible = [a for a in registry.get('articles', []) if a.get('status') == 'publish_ready']
          if len(eligible) != 10:
              raise SystemExit(f'expected 10 publish_ready articles, got {len(eligible)}')
          for article in eligible:
              path = Path(article['source_file'])
              if not path.is_file():
                  raise SystemExit(f'missing article source: {path}')
              body = path.read_text(encoding='utf-8')
              if '# ' not in body or '## ' not in body:
                  raise SystemExit(f'article source lacks required heading structure: {path}')
          print(f'validated {len(eligible)} publish-ready article sources')
          PY

      - name: Build release packages
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          OUT="release/ddg-v2-${SHORT_SHA}"
          mkdir -p "$OUT"

          printf 'branch=codex/rebuild-v2\nsha=%s\nbuilt_at=%s\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT/RELEASE.txt"

          # Standalone migrator ZIP must carry the exact same approved content payload
          # that deploy.sh syncs during repository-based deployments.
          rm -rf .release-migrator
          mkdir -p .release-migrator/bizrise-ddg-migrator/data/content
          rsync -a apps/bizrise-ddg-migrator/ .release-migrator/bizrise-ddg-migrator/
          rsync -a data/content/ .release-migrator/bizrise-ddg-migrator/data/content/

          (cd apps && zip -qr "../$OUT/bizrise-ddg-theme-${SHORT_SHA}.zip" bizrise-ddg-theme)
          (cd apps && zip -qr "../$OUT/bizrise-core-${SHORT_SHA}.zip" bizrise-core)
          (cd .release-migrator && zip -qr "../$OUT/bizrise-ddg-migrator-${SHORT_SHA}.zip" bizrise-ddg-migrator)

          tar -czf "$OUT/ddg-v2-deploy-source-${SHORT_SHA}.tar.gz" \
            .cpanel.yml deploy apps/bizrise-core apps/bizrise-ddg-theme apps/bizrise-ddg-migrator data/content

          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddg-v2-${{ steps.package.outputs.short_sha }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30
